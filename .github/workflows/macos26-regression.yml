name: Sophistry ARM64 macOS 26 regression
on:
  push:
    branches: [codex/sophistry-native-checkpoints]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Installer-ARM64.command'
      - 'requirements-analysis.txt'
      - '.github/workflows/macos26-regression.yml'
permissions:
  contents: read
jobs:
  macos-arm64:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      SOPHISTRY_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and compare native ARM64 code without private licence
        run: bash scripts/validate-native-ci.sh
      - name: Preserve public validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sophistry-cp033-native-macos-arm64
          path: work/ci-report/
          if-no-files-found: warn
          retention-days: 30
